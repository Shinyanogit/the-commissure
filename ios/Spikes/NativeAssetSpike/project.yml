name: NativeAssetSpike
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    PRODUCT_BUNDLE_IDENTIFIER: app.thecommissure.native-asset-spike
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  NativeAssetSpikeCore:
    path: Packages/NativeAssetSpikeCore
targets:
  NativeAssetSpike:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: GeneratedAssets
        buildPhase: resources
    dependencies:
      - package: NativeAssetSpikeCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Asset Spike
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  NativeAssetSpikeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: NativeAssetSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.thecommissure.native-asset-spike-ui-tests
        GENERATE_INFOPLIST_FILE: YES
  NativeAssetSpikePhysicalTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PhysicalTests
    dependencies:
      - target: NativeAssetSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.thecommissure.native-asset-spike-physical-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NativeAssetSpike:
    build:
      targets:
        NativeAssetSpike: all
        NativeAssetSpikeUITests: [test]
    test:
      config: Debug
      targets:
        - NativeAssetSpikeUITests
    run:
      config: Debug
  NativeAssetSpikePhysical:
    build:
      targets:
        NativeAssetSpike: all
        NativeAssetSpikePhysicalTests: [test]
    test:
      config: Debug
      targets:
        - NativeAssetSpikePhysicalTests
