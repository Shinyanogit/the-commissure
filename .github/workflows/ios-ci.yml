name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - "content/**"
      - "tooling/native-assets/**"
      - "tooling/content/**"
      - "tooling/content-publish/**"
      - "tooling/release/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "content/**"
      - "tooling/native-assets/**"
      - "tooling/content/**"
      - "tooling/content-publish/**"
      - "tooling/release/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install content validation dependencies
        run: npm ci --prefix tooling/content
      - name: Validate content and fail-closed delivery gates
        run: |
          node tooling/content/validate-content.mjs
          node tooling/content/test-validator.mjs
          npm test --prefix tooling/content-publish
          npm test --prefix tooling/release
      - name: Install native asset converter
        run: |
          curl -fsSL --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.0-macos-arm64.dmg -o "$RUNNER_TEMP/blender.dmg"
          echo "ed4d8390166dec5ea0a2813a03db6221f206ce016442be7f59f41d760972568a  $RUNNER_TEMP/blender.dmg" | shasum -a 256 -c -
          hdiutil attach "$RUNNER_TEMP/blender.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/blender-mount"
          ditto "$RUNNER_TEMP/blender-mount/Blender.app" "$RUNNER_TEMP/Blender.app"
          hdiutil detach "$RUNNER_TEMP/blender-mount"
          echo "$RUNNER_TEMP/Blender.app/Contents/MacOS" >> "$GITHUB_PATH"
      - name: Build verified native assets
        run: |
          tooling/native-assets/build-all.sh
          python3 tooling/native-assets/test_integrity.py
      - name: Lint Swift formatting
        run: swift format lint --strict --recursive ios/App ios/Packages/CommissureCore/Sources ios/Packages/CommissureCore/Tests ios/Tests ios/UITests
      - name: Test pure core
        run: swift test --package-path ios/Packages/CommissureCore
      - name: Build and test app
        run: >-
          xcodebuild test
          -project ios/TheCommissure.xcodeproj
          -scheme TheCommissure
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO
      - name: Unsigned archive smoke
        run: >-
          xcodebuild archive
          -project ios/TheCommissure.xcodeproj
          -scheme TheCommissure
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/TheCommissure.xcarchive"
          CODE_SIGNING_ALLOWED=NO
